plugins {
	id 'net.fabricmc.fabric-loom' version "1.19-SNAPSHOT"
}

version = "0.7.3+mc26.3"
group = "com.irisdlss"

repositories {
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	minecraft "com.mojang:minecraft:26.3"
	implementation "net.fabricmc:fabric-loader:0.20.1"
	compileOnly "com.terraformersmc:modmenu:21.0.0"
	// Sodium config API (optional at runtime; the entry point only loads with Sodium)
	compileOnly files(project.property("sodium_jar"))
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Native bridge (built by dlss-bridge/build.bat) and NVIDIA's DLSS runtime are packed into the jar.
tasks.register("copyNatives", Copy) {
	from("../dlss-bridge/out") { include "irisdlss.dll", "nvngx_dlss.dll", "nvngx_dlssg.dll" }
	from("../dlss-bridge/third_party/ngx") { include "LICENSE.txt"; rename { "NVIDIA_DLSS_LICENSE.txt" } }
	into "src/main/resources/natives"
}
processResources.dependsOn copyNatives

loom {
	runs {
		client {
			// Test game dir (Sodium, Fabric API, Vitrail, shader packs; not in git, see README "Build from source").
			runDir = "run"
			// Own LWJGL extract dir: another running Minecraft (e.g. Lunar Client) locks
			// %TEMP%/lwjgl_<user>/.../lwjgl_zstd.dll, which Voxy needs to extract its own copy.
			vmArg "-Dorg.lwjgl.system.SharedLibraryExtractPath=" + file("run/lwjgl-natives").absolutePath
			// gradlew runClient -PdlssDebug=spin|walk|still: steady camera turn, walking forward or a still camera, and a
			// frame-generation capture into run/iris-dlss/captures (generated + real frames as PNG).
			if (project.hasProperty("dlssDebug")) {
				def mode = project.property("dlssDebug")
				if (mode == "walk") {
					vmArg "-Diris-dlss.debugWalk=true"
				} else if (mode != "still") {
					vmArg "-Diris-dlss.debugSpin=1.5"
				}
				vmArg "-Diris-dlss.captureAt=" + (project.findProperty("captureAt") ?: "300")
				vmArg "-Diris-dlss.debugLog=true"
			}
			// Test run without the Iris fork (e.g. with Vitrail): -PtestWorld=<name> joins/creates that world,
			// -PtestCommands="time set 1500;tp @p ..." after joining, -PtestPitch=20, -PtestTicks=400 until
			// run/screenshots/dlss-test.png is saved and the game quits. -PwindowSize=1920x1080.
			// -PtestRepeat="execute as @e[type=pig] at @s run tp @s ~0.1 ~ ~ ~5 ~" runs every tick from then on.
			["testWorld", "testCommands", "testRepeat", "testPitch", "testTicks"].each { name ->
				if (project.hasProperty(name)) {
					vmArg "-Diris-dlss.${name}=" + project.property(name)
				}
			}
			// -PdlssOff: DLSS off once in the world, still on Vulkan (compare with DLSS on).
			// -PdlssScreen=mod|sodium|sodium2 opens the DLSS settings after joining (for the test screenshot).
			if (project.hasProperty("dlssScreen")) {
				vmArg "-Diris-dlss.debugScreen=" + project.property("dlssScreen")
			}
			if (project.hasProperty("dlssOff")) {
				vmArg "-Diris-dlss.devNoDlss=true"
			}
			if (project.hasProperty("dlssBenchmark")) {
				vmArg "-Diris-dlss.benchmark=true"
				vmArg "-Diris-dlss.testTicks=4000"
			}
			if (project.hasProperty("windowSize")) {
				def size = project.property("windowSize").toString().split("x")
				programArgs "--width", size[0], "--height", size[1]
			}
		}
	}
}
